name: Sideloadly Server

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */6 * *'

jobs:
  sideloadly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq libimobiledevice6 libimobiledevice-utils ideviceinstaller \
            openssl curl unzip jq python3 python3-pip git build-essential \
            strongswan strongswan-pki libstrongswan-extra-plugins iptables qrencode
          
          # Install zsign from pre-built binary
          curl -sL https://github.com/zhlynn/zsign/releases/latest/download/zsign-linux-x64 -o /tmp/zsign 2>/dev/null || \
          curl -sL https://github.com/zhlynn/zsign/releases/download/0.4/zsign -o /tmp/zsign 2>/dev/null || true
          
          if [ -f /tmp/zsign ] && file /tmp/zsign 2>/dev/null | grep -q "ELF"; then
            chmod +x /tmp/zsign
            sudo mv /tmp/zsign /usr/local/bin/zsign
          else
            git clone https://github.com/zhlynn/zsign.git /tmp/zsign-build 2>/dev/null || \
            git clone https://github.com/SignTools/zsign.git /tmp/zsign-build 2>/dev/null || true
            if [ -d /tmp/zsign-build ] && [ -f /tmp/zsign-build/Makefile ]; then
              cd /tmp/zsign-build && make -j$(nproc) && sudo make install
            fi
          fi
          
          echo "zsign: $(which zsign 2>/dev/null || echo 'NOT FOUND - will skip signing')"

      - name: Start Anisette
        run: |
          pip3 install -q flask
          cat > /tmp/anisette_server.py << 'ANEOF'
          import json, time, uuid, random, hashlib
          from http.server import HTTPServer, BaseHTTPRequestHandler
          
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  mid = ''.join(random.choices('0123456789abcdef', k=32))
                  local_id = ''.join(random.choices('0123456789abcdef', k=32))
                  one_time = ''.join(random.choices('0123456789abcdef', k=32))
                  device_id = str(uuid.uuid4()).upper()
                  serial = "C02" + ''.join(random.choices('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ', k=10))
                  
                  response = {
                      "X-Apple-I-MD": mid,
                      "X-Apple-I-MD-RINFO": "17106176",
                      "X-Apple-I-MD-M": hashlib.md5(mid.encode()).hexdigest(),
                      "X-Apple-I-SRL-NO": serial,
                      "X-Apple-I-Client-Time": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                      "X-Apple-I-TimeZone": "UTC",
                      "X-Apple-I-Locale": "en_US",
                      "X-Apple-I-UTCOffset": "-0000",
                      "X-Apple-I-MD-LU": local_id,
                      "X-Apple-I-MD-RM": hashlib.md5(mid.encode()).hexdigest(),
                      "X-Apple-I-OD": one_time,
                      "X-Apple-I-DI": device_id,
                      "X-Apple-I-ABS-MD": hashlib.sha256(mid.encode()).hexdigest(),
                      "X-Apple-I-ABS-GuID": str(uuid.uuid4()).upper(),
                      "X-Apple-ID-Device-Description": "<MacBookPro18,3> <Mac OS X;13.4.0;22F66> <com.apple.AuthKit/1>",
                      "X-Apple-I-Req-Client-Ingest": "true",
                      "X-Apple-I-Req-Client-Name": hashlib.md5(str(random.random()).encode()).hexdigest(),
                      "X-Apple-I-Req-Client-Version": "1.0",
                      "X-Apple-I-Req-Client-Device": device_id,
                  }
                  
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Access-Control-Allow-Origin", "*")
                  self.end_headers()
                  self.wfile.write(json.dumps(response).encode())
              
              def log_message(self, *args):
                  pass
          
          HTTPServer(("0.0.0.0", 6969), Handler).serve_forever()
          ANEOF
          
          nohup python3 /tmp/anisette_server.py > /tmp/anisette.log 2>&1 &
          sleep 3
          curl -s http://localhost:6969 | python3 -c "import sys,json; d=json.load(sys.stdin); print('Anisette OK - Serial:', d.get('X-Apple-I-SRL-NO','?'))"

      - name: Setup VPN certs
        run: |
          mkdir -p /tmp/vpn
          ipsec pki --gen --type rsa --size 4096 --outform pem > /tmp/vpn/ca-key.pem 2>/dev/null
          ipsec pki --self --ca --lifetime 3650 --in /tmp/vpn/ca-key.pem \
            --dn "CN=CA" --outform pem > /tmp/vpn/ca-cert.pem 2>/dev/null
          ipsec pki --gen --type rsa --size 2048 --outform pem > /tmp/vpn/server-key.pem 2>/dev/null
          ipsec pki --pub --in /tmp/vpn/server-key.pem 2>/dev/null | ipsec pki --issue --lifetime 365 \
            --cacert /tmp/vpn/ca-cert.pem --cakey /tmp/vpn/ca-key.pem \
            --dn "CN=sideloadly" --san sideloadly --san localhost \
            --flag serverAuth --flag ikeIntermediate --outform pem > /tmp/vpn/server-cert.pem 2>/dev/null
          echo "VPN certs generated (TPM warnings are harmless)"

      - name: Start VPN server
        run: |
          sudo cp /tmp/vpn/ca-cert.pem /etc/ipsec.d/cacerts/
          sudo cp /tmp/vpn/server-cert.pem /etc/ipsec.d/certs/
          sudo cp /tmp/vpn/server-key.pem /etc/ipsec.d/private/
          sudo chmod 600 /etc/ipsec.d/private/server-key.pem
          sudo tee /etc/ipsec.conf > /dev/null << 'EOF'
          config setup
              uniqueids=no
          conn ikev2-vpn
              auto=add
              type=tunnel
              keyexchange=ikev2
              fragmentation=yes
              forceencaps=yes
              dpdaction=clear
              dpddelay=300s
              rekey=no
              left=%any
              leftcert=/etc/ipsec.d/certs/server-cert.pem
              leftsendcert=always
              leftsubnet=0.0.0.0/0
              right=%any
              rightid=%any
              rightauth=eap-mschapv2
              rightsourceip=10.10.10.0/24
              rightdns=1.1.1.1,8.8.8.8
              rightsendcert=never
              eap_identity=%identity
          EOF
          sudo tee /etc/ipsec.secrets > /dev/null << 'EOF'
          : RSA /etc/ipsec.d/private/server-key.pem
          EOF
          IPHONE_PASS=$(openssl rand -base64 12)
          echo "iphone : EAP \"$IPHONE_PASS\"" | sudo tee /etc/ipsec.eap-secrets
          echo "IPHONE_PASS=$IPHONE_PASS" >> $GITHUB_ENV
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -t nat -A POSTROUTING -s 10.10.10.0/24 -o eth0 -j MASQUERADE
          sudo ipsec restart 2>/dev/null
          sleep 3
          echo "VPN server started"

      - name: Apple login + cert generation
        id: cert
        run: |
          # Get fresh anisette data
          ANISETTE=$(curl -s http://localhost:6969)
          MID=$(echo "$ANISETTE" | jq -r '.["X-Apple-I-MD"]')
          RINFO=$(echo "$ANISETTE" | jq -r '.["X-Apple-I-MD-RINFO"]')
          SERIAL=$(echo "$ANISETTE" | jq -r '.["X-Apple-I-SRL-NO"]')
          CTIME=$(echo "$ANISETTE" | jq -r '.["X-Apple-I-Client-Time"]')
          LOCALE=$(echo "$ANISETTE" | jq -r '.["X-Apple-I-Locale"]')
          TZ=$(echo "$ANISETTE" | jq -r '.["X-Apple-I-TimeZone"]')
          DEVICE_DESC=$(echo "$ANISETTE" | jq -r '.["X-Apple-ID-Device-Description"]')
          
          echo "Anisette serial: $SERIAL"
          
          # Login to Apple - try alternate auth endpoint
          echo "Attempting Apple login..."
          
          LOGIN_BODY="{\"accountName\":\"${{ secrets.APPLE_ID }}\",\"password\":\"${{ secrets.APPLE_PASSWORD }}\",\"rememberMe\":true}"
          
          LOGIN_RESP=$(curl -s -w "\n%{http_code}" -D /tmp/apple_headers.txt -X POST \
            "https://idmsa.apple.com/appleauth/auth/signin" \
            -H "X-Apple-I-MD: $MID" \
            -H "X-Apple-I-MD-RINFO: $RINFO" \
            -H "X-Apple-I-SRL-NO: $SERIAL" \
            -H "X-Apple-I-Client-Time: $CTIME" \
            -H "X-Apple-I-TimeZone: $TZ" \
            -H "X-Apple-I-Locale: $LOCALE" \
            -H "X-Apple-ID-Device-Description: $DEVICE_DESC" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "User-Agent: Xcode/14.3.1 (14E300c)" \
            -H "X-Requested-With: XMLHttpRequest" \
            -d "$LOGIN_BODY")
          
          HTTP_CODE=$(echo "$LOGIN_RESP" | tail -1)
          RESP_BODY=$(echo "$LOGIN_RESP" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response (first 300 chars): ${RESP_BODY:0:300}"
          
          # Handle 503 - retry with different approach
          if [ "$HTTP_CODE" = "503" ]; then
            echo "Got 503. Waiting 15s and retrying with alternate headers..."
            sleep 15
            ANISETTE=$(curl -s http://localhost:6969)
            MID=$(echo "$ANISETTE" | jq -r '.["X-Apple-I-MD"]')
            CTIME=$(echo "$ANISETTE" | jq -r '.["X-Apple-I-Client-Time"]')
            SERIAL=$(echo "$ANISETTE" | jq -r '.["X-Apple-I-SRL-NO"]')
            
            LOGIN_RESP=$(curl -s -w "\n%{http_code}" -D /tmp/apple_headers.txt -X POST \
              "https://idmsa.apple.com/appleauth/auth/signin" \
              -H "X-Apple-I-MD: $MID" \
              -H "X-Apple-I-MD-RINFO: 17106176" \
              -H "X-Apple-I-SRL-NO: $SERIAL" \
              -H "X-Apple-I-Client-Time: $CTIME" \
              -H "X-Apple-I-TimeZone: UTC" \
              -H "X-Apple-I-Locale: en_US" \
              -H "X-Apple-ID-Device-Description: <MacBookPro18,3> <Mac OS X;13.4.0;22F66>" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -H "User-Agent: Xcode/14.3.1 (14E300c)" \
              -d "$LOGIN_BODY")
            
            HTTP_CODE=$(echo "$LOGIN_RESP" | tail -1)
            RESP_BODY=$(echo "$LOGIN_RESP" | sed '$d')
            echo "Retry HTTP Status: $HTTP_CODE"
          fi
          
          TOKEN=$(grep -i "x-apple-session-token" /tmp/apple_headers.txt | awk -F': ' '{print $2}' | tr -d '\r')
          SCNT=$(grep -i "scnt" /tmp/apple_headers.txt | awk -F': ' '{print $2}' | tr -d '\r')
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "409" ]; then
            if [ -n "$TOKEN" ]; then
              echo "Got session token"
              echo "SESSION_TOKEN=$TOKEN" >> $GITHUB_ENV
              
              if [ "$HTTP_CODE" = "409" ]; then
                echo "2FA required"
                echo "PENDING_2FA=true" >> $GITHUB_ENV
                echo "SCNT=$SCNT" >> $GITHUB_ENV
                echo "$ANISETTE" > /tmp/2fa_anisette.json
              else
                echo "Login successful - no 2FA"
                echo "PENDING_2FA=false" >> $GITHUB_ENV
                
                # Get team
                TEAM_RESP=$(curl -s -X POST \
                  "https://developerservices2.apple.com/services/QH65B2/listTeams.action" \
                  -H "X-Apple-I-MD: $MID" \
                  -H "X-Apple-I-MD-RINFO: $RINFO" \
                  -H "X-Apple-I-SRL-NO: $SERIAL" \
                  -H "X-Apple-I-Client-Time: $CTIME" \
                  -H "X-Apple-I-TimeZone: $TZ" \
                  -H "X-Apple-I-Locale: $LOCALE" \
                  -H "X-Apple-Session-Token: $TOKEN" \
                  -H "Content-Type: text/x-xml-plist" \
                  -H "User-Agent: Xcode/14.3.1 (14E300c)")
                
                TEAM_ID=$(echo "$TEAM_RESP" | python3 -c "
                import sys, plistlib
                try:
                    d = plistlib.loads(sys.stdin.buffer.read())
                    teams = d.get('teams', [])
                    print(teams[0].get('teamId', '') if teams else '')
                except Exception as e:
                    print(f'Error: {e}', file=sys.stderr)
                " 2>/dev/null)
                
                if [ -n "$TEAM_ID" ]; then
                  echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
                  echo "Team: $TEAM_ID"
                  
                  # Generate cert
                  openssl genrsa -out /tmp/key.pem 2048 2>/dev/null
                  openssl req -new -key /tmp/key.pem -out /tmp/csr.pem \
                    -subj "/CN=Temp Dev/OU=$TEAM_ID/O=Sideloadly/C=US" 2>/dev/null
                  
                  CSR_DATA=$(cat /tmp/csr.pem)
                  
                  CERT_PLIST=$(python3 -c "
                  import plistlib
                  print(plistlib.dumps({
                      'csr': open('/tmp/csr.pem').read(),
                      'teamId': '$TEAM_ID',
                      'type': 'ios_development'
                  }).decode())
                  ")
                  
                  CERT_RESP=$(curl -s -X POST \
                    "https://developerservices2.apple.com/services/QH65B2/ios/submitDevelopmentCSR.action" \
                    -H "X-Apple-I-MD: $MID" \
                    -H "X-Apple-I-MD-RINFO: $RINFO" \
                    -H "X-Apple-I-SRL-NO: $SERIAL" \
                    -H "X-Apple-I-Client-Time: $CTIME" \
                    -H "X-Apple-I-TimeZone: $TZ" \
                    -H "X-Apple-I-Locale: $LOCALE" \
                    -H "X-Apple-Session-Token: $TOKEN" \
                    -H "Content-Type: text/x-xml-plist" \
                    -H "User-Agent: Xcode/14.3.1 (14E300c)" \
                    -d "$CERT_PLIST")
                  
                  CERT_DATA=$(echo "$CERT_RESP" | python3 -c "
                  import sys, plistlib
                  try:
                      d = plistlib.loads(sys.stdin.buffer.read())
                      cert = d.get('certificate', '')
                      print(cert)
                  except:
                      pass
                  " 2>/dev/null)
                  
                  if [ -n "$CERT_DATA" ]; then
                    echo "$CERT_DATA" > /tmp/cert.pem
                    openssl pkcs12 -export -in /tmp/cert.pem -inkey /tmp/key.pem \
                      -out /tmp/dev.p12 -passout pass:sideloadly 2>/dev/null
                    echo "CERT_READY=true" >> $GITHUB_ENV
                    echo "Certificate generated"
                  else
                    echo "WARNING: Certificate generation failed"
                    echo "Response: ${CERT_RESP:0:500}"
                  fi
                else
                  echo "WARNING: No team ID found"
                fi
              fi
            else
              echo "No session token in response"
              grep -i "x-apple" /tmp/apple_headers.txt || echo "(no Apple headers found)"
            fi
          else
            echo "Login failed with HTTP $HTTP_CODE"
            echo "Full response: $RESP_BODY"
          fi

      - name: Wait for iPhone + Pair
        run: |
          echo "Waiting for iPhone VPN connection..."
          for i in $(seq 1 60); do
            if sudo ipsec status ikev2-vpn 2>/dev/null | grep -q "ESTABLISHED"; then
              IPHONE_IP=$(sudo ipsec status ikev2-vpn | grep -oP '10\.10\.10\.\d+' | head -1)
              echo "IPHONE_IP=$IPHONE_IP" >> $GITHUB_ENV
              echo "iPhone connected: $IPHONE_IP"
              
              echo "Attempting pair..."
              idevicepair -n -d "$IPHONE_IP" pair 2>&1 || echo "Pair attempted (check Trust popup)"
              
              if ideviceinfo -n -d "$IPHONE_IP" &>/dev/null; then
                UDID=$(ideviceinfo -n -d "$IPHONE_IP" | grep "^UniqueDeviceID:" | awk '{print $2}')
                echo "UDID=$UDID" >> $GITHUB_ENV
                echo "Paired! UDID: $UDID"
              fi
              break
            fi
            sleep 2
          done

      - name: Create provisioning profile
        if: env.UDID && env.TEAM_ID
        run: |
          cat > /tmp/profile.plist << PROFILE
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>ApplicationIdentifierPrefix</key>
              <array><string>${{ env.TEAM_ID }}</string></array>
              <key>CreationDate</key>
              <date>$(date -u +"%Y-%m-%dT%H:%M:%SZ")</date>
              <key>ExpirationDate</key>
              <date>$(date -u -d "+7 days" +"%Y-%m-%dT%H:%M:%SZ")</date>
              <key>ProvisionedDevices</key>
              <array><string>${{ env.UDID }}</string></array>
              <key>TeamIdentifier</key>
              <array><string>${{ env.TEAM_ID }}</string></array>
              <key>UUID</key>
              <string>$(uuidgen)</string>
              <key>Version</key>
              <integer>1</integer>
              <key>Entitlements</key>
              <dict>
                  <key>application-identifier</key>
                  <string>${{ env.TEAM_ID }}.*</string>
                  <key>com.apple.developer.team-identifier</key>
                  <string>${{ env.TEAM_ID }}</string>
                  <key>get-task-allow</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PROFILE
          echo "Profile created"

      - name: Start Web UI
        run: |
          pip3 install -q flask flask-cors
          cat > /tmp/server.py << 'PYEOF'
          import os, json, time, uuid, subprocess, base64
          from pathlib import Path
          from flask import Flask, request, jsonify, render_template_string
          from flask_cors import CORS
          
          app = Flask(__name__)
          CORS(app)
          
          WORK = Path("/tmp/sideloadly")
          UPLOADS = WORK / "uploads"
          SIGNED = WORK / "signed"
          for d in [WORK, UPLOADS, SIGNED]: d.mkdir(parents=True, exist_ok=True)
          
          HTML = """<!DOCTYPE html><html><head>
          <title>Sideloadly</title>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          *{margin:0;padding:0;box-sizing:border-box}
          body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#000;color:#fff}
          .container{max-width:600px;margin:0 auto;padding:16px}
          h1{color:#0f0;margin-bottom:8px}
          .card{background:#111;border:1px solid #222;border-radius:12px;padding:16px;margin-bottom:12px}
          h2{color:#0f0;font-size:1.1em;margin-bottom:10px}
          input,button{width:100%;padding:10px;margin-bottom:8px;background:#1a1a1a;border:1px solid #333;
            color:#fff;border-radius:8px;font-size:0.95em}
          button{background:#0f0;color:#000;font-weight:700;cursor:pointer;border:none}
          .status{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.75em;font-weight:700}
          .ok{background:#0f02;color:#0f0}.bad{background:#f442;color:#f44}
          pre{background:#0a0a0a;padding:10px;border-radius:8px;font-size:0.75em;max-height:200px;overflow-y:auto;color:#aaa}
          </style></head><body>
          <div class="container">
          <h1>📱 Sideloadly</h1>
          <p style="color:#888;margin-bottom:16px">Free dev cert · VPN install · No PC</p>
          
          <div class="card">
          <h2>Status</h2>
          <div id="status">Loading...</div>
          </div>
          
          <div class="card">
          <h2>Upload IPA</h2>
          <input type="file" id="ipaFile" accept=".ipa">
          <button onclick="install()">Sign & Install</button>
          <div id="result"></div>
          </div>
          </div>
          <script>
          async function api(e,d={}){
            const r=await fetch('/api/'+e,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
            return await r.json()
          }
          async function refresh(){
            const s=await api('status');
            document.getElementById('status').innerHTML=
              '<p>VPN: '+(s.iphone_connected?'<span class="status ok">Connected</span> '+s.iphone_ip:'<span class="status bad">Waiting</span>')+'</p>'+
              '<p>Cert: '+(s.cert_ready?'<span class="status ok">Ready</span>':'<span class="status bad">Not ready</span>')+'</p>'+
              '<p>Team: '+(s.team_id||'...')+'</p>'+
              '<p>2FA: '+(s.pending_2fa?'<span class="status bad">Required</span>':'<span class="status ok">OK</span>')+'</p>';
          }
          async function install(){
            const f=document.getElementById('ipaFile').files[0];
            if(!f) return alert('Select IPA');
            const fd=new FormData();fd.append('ipa',f);
            const r=await fetch('/api/install',{method:'POST',body:fd});
            document.getElementById('result').innerHTML='<pre>'+JSON.stringify(await r.json(),null,2)+'</pre>';
          }
          setInterval(refresh,5000);refresh()
          </script></body></html>"""
          
          def get_iphone_ip():
              try:
                  r = subprocess.run(["sudo","ipsec","status","ikev2-vpn"],capture_output=True,text=True)
                  for line in r.stdout.split('\n'):
                      if '10.10.10.' in line and 'ESTABLISHED' in line:
                          import re
                          m=re.search(r'10\.10\.10\.\d+',line)
                          if m: return m.group()
              except: pass
              return None
          
          @app.route('/')
          def index(): return render_template_string(HTML)
          
          @app.route('/api/status', methods=['POST'])
          def api_status():
              return jsonify({
                  "iphone_connected": get_iphone_ip() is not None,
                  "iphone_ip": get_iphone_ip() or "N/A",
                  "cert_ready": os.path.exists("/tmp/dev.p12"),
                  "team_id": os.environ.get("TEAM_ID",""),
                  "pending_2fa": os.environ.get("PENDING_2FA","") == "true"
              })
          
          @app.route('/api/install', methods=['POST'])
          def api_install():
              f = request.files['ipa']
              ipa_path = UPLOADS / f"{uuid.uuid4()}.ipa"
              f.save(str(ipa_path))
              
              ip = get_iphone_ip()
              if not ip:
                  return jsonify({"status":"error","message":"iPhone not connected to VPN"})
              
              if not os.path.exists("/tmp/dev.p12"):
                  return jsonify({"status":"error","message":"Certificate not ready. Login first."})
              
              signed = SIGNED / f"signed_{uuid.uuid4()}.ipa"
              result = subprocess.run(["zsign","-k","/tmp/dev.p12","-p","sideloadly",
                "-m","/tmp/profile.plist","-o",str(signed),str(ipa_path)],
                capture_output=True,text=True)
              
              if not signed.exists():
                  return jsonify({"status":"error","output":result.stdout+result.stderr})
              
              r = subprocess.run(["ideviceinstaller","-n","-d",ip,"install",str(signed)],
                capture_output=True,text=True)
              
              import shutil
              shutil.copy(str(signed), "/tmp/signed.ipa")
              
              return jsonify({"status":"done","output":r.stdout+r.stderr})
          
          app.run(host="0.0.0.0",port=8080)
          PYEOF
          
          nohup python3 /tmp/server.py > /tmp/web.log 2>&1 &
          sleep 2
          echo "Web UI on :8080"

      - name: Expose Web UI
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:8080 > /tmp/tunnel.log 2>&1 &
          sleep 8
          TUNNEL=$(grep -o 'https://[a-z0-9.-]*\.trycloudflare\.com' /tmp/tunnel.log | head -1)
          echo ""
          echo "=============================================="
          echo "🌐 Web UI: $TUNNEL"
          echo "=============================================="
          echo "📱 VPN Server: $TUNNEL (use just the domain part)"
          echo "🔑 VPN Password: $IPHONE_PASS"
          echo "=============================================="

      - name: Keep alive
        run: |
          echo "Server alive."
          echo "iPhone VPN IP: ${{ env.IPHONE_IP }}"
          echo "Team ID: ${{ env.TEAM_ID }}"
